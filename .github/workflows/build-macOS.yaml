name: Build macOS Executable

# This disables automatic builds on push. 
# It will ONLY run when you manually click "Run workflow" on GitHub.com.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
        # Add any other libraries your app uses below this line (e.g. pip install custom_library)

    - name: Build Mac Executable
      run: |
        pyinstaller --onefile --windowed \
          --name="DularLandBank" \
          --icon="icon.png" \
          --add-data "icon.png:." \
          --add-data "Inter-Italic-VariableFont_opsz,wght.ttf:." \
          --add-data "Inter-VariableFont_opsz,wght.ttf:." \
          DularLandBank.py

    - name: Zip the output file
      run: |
        cd dist
        zip -r DularLandBank-macOS.zip DularLandBank.app

    - name: Upload zip file as artifact
      uses: actions/upload-artifact@v4
      with:
        name: DularLandBank-macOS
        path: dist/DularLandBank-macOS.zip
