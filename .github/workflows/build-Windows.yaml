name: Build Windows Executable

# Manual trigger only (click "Run workflow" on GitHub)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller Pillow
        # Add any extra libraries your app needs below (e.g., pip install PyQt6 requests)

    - name: Build Windows Executable
      run: |
        pyinstaller --onefile --windowed `
          --name="DularLandBank" `
          --icon="icon.png" `
          --add-data "icon.png;." `
          --add-data "Inter-Italic-VariableFont_opsz,wght.ttf;." `
          --add-data "Inter-VariableFont_opsz,wght.ttf;." `
          DularLandBank.py

    - name: Upload Windows Executable as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DularLandBank-Windows
        path: dist/DularLandBank.exe
