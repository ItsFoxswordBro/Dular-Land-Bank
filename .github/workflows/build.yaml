name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers when you create a release tag (e.g., v1.0.0)
  workflow_dispatch: # Allows you to manually trigger it from GitHub anytime

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Required permission to publish Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build EXE with Assets
        # Note: Use --add-data "sourceFolder;targetFolder" on Windows!
        # Update/add folders as needed (e.g. assets, images, config.json)
        run: |
          pyinstaller --onefile --noconsole `
            --add-data "assets;assets" `
            DularLandBankPrototype.py

      - name: Create GitHub Release and Attach EXE
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/main.exe
          generate_release_notes: true
